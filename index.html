<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Life Decider — AI Daily Schedule Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0f17;
      --card-bg: rgba(22, 26, 40, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #7c3aed;
      --accent-blue: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --success-green: #10b981;
      --warning-yellow: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input, textarea {
      width: 100%;
      background: rgba(15, 18, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    .goal-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      position: relative;
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: none;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-remove:hover {
      background: rgba(239, 68, 68, 0.4);
    }

    .btn-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--accent-purple);
      color: #a78bfa;
      padding: 0.75rem;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn-secondary:hover {
      background: rgba(124, 58, 237, 0.15);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent-gradient);
      border: none;
      color: white;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 1rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(124, 58, 237, 0.6);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Output Results Styles */
    .schedule-header {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      color: #34d399;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .schedule-item {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent-blue);
      padding: 0.75rem 1rem;
      border-radius: 6px;
    }

    .schedule-item strong {
      display: block;
      color: #fff;
      font-size: 0.95rem;
    }

    .schedule-item span {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(124, 58, 237, 0.2);
      color: #c4b5fd;
    }

    .link-btn {
      display: inline-block;
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.85rem;
      margin-top: 0.25rem;
      transition: color 0.2s;
    }

    .link-btn:hover {
      text-decoration: underline;
      color: #60a5fa;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Your Life Decider</h1>
      <p>AI-Powered Daily Schedule & Mastery Planner</p>
    </header>

    <!-- Input Form -->
    <div id="planner-form" class="card">
      <div class="card-title">
        <span>1. Daily Constraints & Available Time</span>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="constraints">Daily Constraints / Routine</label>
          <input type="text" id="constraints" placeholder="e.g. Work 9-5, Sleep 8h, Chores 2h" value="Work 9 AM - 5 PM, Sleep 8 hours">
        </div>
        <div class="form-group">
          <label for="free-hours">Free Hours Dedicated for Goals</label>
          <input type="number" id="free-hours" min="1" max="16" value="4">
        </div>
      </div>

      <div class="card-title" style="margin-top: 1.5rem;">
        <span>2. Your Goals (Max 10)</span>
      </div>

      <div id="goals-container">
        <!-- Dynamic Goal Cards inserted here -->
      </div>

      <button type="button" class="btn-secondary" id="add-goal-btn">+ Add Another Goal</button>

      <button type="button" class="btn-primary" id="generate-btn">
        <span id="btn-text">Generate Life Schedule</span>
        <span id="btn-spinner" class="spinner hidden"></span>
      </button>
    </div>

    <!-- Output Display -->
    <div id="output-container" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="font-size: 1.5rem; color: #fff;">Your Personal Life Schedule</h2>
        <button class="btn-secondary" style="width: auto; padding: 0.5rem 1rem;" onclick="resetForm()">Reset Planner</button>
      </div>

      <!-- Time Management Card -->
      <div class="card">
        <div class="card-title">
          <span>Time Management Breakdown</span>
        </div>
        <div class="schedule-header" id="time-evaluation">
          Evaluating schedule...
        </div>
        <div class="schedule-grid" id="daily-schedule-list">
          <!-- Daily Schedule Items -->
        </div>
      </div>

      <!-- Goals Container -->
      <div id="rendered-goals">
        <!-- Rendered AI Goals -->
      </div>
    </div>
  </div>

  <script>
    let goalCount = 0;

    // Initial default goals
    const initialGoals = [
      { name: "Boxing & Fitness", experience: "Beginner, zero experience", duration: 30 }
    ];

    function createGoalCard(goalData = { name: '', experience: '', duration: 14 }) {
      if (goalCount >= 10) return;
      goalCount++;
      
      const container = document.getElementById('goals-container');
      const goalId = `goal-${Date.now()}-${goalCount}`;

      const card = document.createElement('div');
      card.className = 'goal-card';
      card.id = goalId;
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
          <strong style="color: #a78bfa; font-size: 0.9rem;">Goal #${goalCount}</strong>
          ${goalCount > 1 ? `<button type="button" class="btn-remove" onclick="removeGoal('${goalId}')">Remove</button>` : ''}
        </div>
        <div class="form-group">
          <label>Goal Name</label>
          <input type="text" class="goal-name" placeholder="e.g. Boxing, Full-Stack Web Dev" value="${goalData.name}" required>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Past Experience / Notes</label>
            <input type="text" class="goal-exp" placeholder="e.g. Total beginner / 1 year exp" value="${goalData.experience}">
          </div>
          <div class="form-group">
            <label>Target Duration (Days)</label>
            <input type="number" class="goal-duration" min="1" max="365" value="${goalData.duration}">
          </div>
        </div>
      `;
      container.appendChild(card);
    }

    function removeGoal(id) {
      const card = document.getElementById(id);
      if (card) {
        card.remove();
        goalCount--;
      }
    }

    document.getElementById('add-goal-btn').addEventListener('click', () => createGoalCard());

    // Initialize with default goal
    initialGoals.forEach(g => createGoalCard(g));

    // Submit to backend Edge handler
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const generateBtn = document.getElementById('generate-btn');

      // Collect user form inputs
      const constraints = document.getElementById('constraints').value;
      const freeHours = document.getElementById('free-hours').value;

      const goalCards = document.querySelectorAll('.goal-card');
      const goals = [];

      goalCards.forEach((card, idx) => {
        const name = card.querySelector('.goal-name').value;
        const experience = card.querySelector('.goal-exp').value;
        const duration = card.querySelector('.goal-duration').value;

        if (name.trim()) {
          goals.push({
            goal_number: idx + 1,
            name: name,
            experience: experience || 'None',
            duration: duration || 14
          });
        }
      });

      if (goals.length === 0) {
        alert("Please specify at least one goal.");
        return;
      }

      const promptPayload = `Daily Constraints: ${constraints}. Free Hours Available for Goals: ${freeHours} hours per day. Goals: ${JSON.stringify(goals)}`;

      // Loading State
      btnText.innerText = "Generating Schedule...";
      btnSpinner.classList.remove('hidden');
      generateBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt: promptPayload })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || `Server returned status ${response.status}`);
        }

        renderResults(result);

      } catch (error) {
        console.error("Schedule Generation Error:", error);
        alert(`Error: ${error.message}`);
      } finally {
        btnText.innerText = "Generate Life Schedule";
        btnSpinner.classList.add('hidden');
        generateBtn.disabled = false;
      }
    });

    function renderResults(data) {
      document.getElementById('planner-form').classList.add('hidden');
      document.getElementById('output-container').classList.remove('hidden');

      // Render Time Management
      const timeMgmt = data.time_management || {};
      document.getElementById('time-evaluation').innerText = timeMgmt.evaluation || "Schedule compiled successfully.";

      const scheduleList = document.getElementById('daily-schedule-list');
      scheduleList.innerHTML = '';
      (timeMgmt.daily_schedule || []).forEach(item => {
        const div = document.createElement('div');
        div.className = 'schedule-item';
        div.innerHTML = `<strong>${item.activity}</strong><span>${item.hours} hrs / day</span>`;
        scheduleList.appendChild(div);
      });

      // Render Goals
      const goalsContainer = document.getElementById('rendered-goals');
      goalsContainer.innerHTML = '';

      (data.goals || []).forEach(g => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-title">
            <span>Goal #${g.goal_number}: ${g.goal_name}</span>
            <span class="badge">${g.analysis?.verdict || 'Active'}</span>
          </div>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
            ${g.analysis?.explanation || ''} (${g.analysis?.phase_duration || ''})
          </p>

          <h4 style="color: #fff; margin: 1rem 0 0.5rem 0;">Daily Plan</h4>
          <div style="display: grid; gap: 0.5rem; margin-bottom: 1rem;">
            ${(g.daily_plan || []).map(dp => `
              <div style="background: rgba(255,255,255,0.02); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem;">
                <strong style="color: #a78bfa;">${dp.day}:</strong> ${dp.action}
              </div>
            `).join('')}
          </div>

          ${g.gadgets && g.gadgets.length > 0 ? `
            <h4 style="color: #fff; margin: 1rem 0 0.5rem 0;">Recommended Gear / Gadgets</h4>
            <ul style="padding-left: 1.25rem; color: var(--text-muted); font-size: 0.85rem;">
              ${g.gadgets.map(gadget => `
                <li style="margin-bottom: 0.25rem;">
                  <strong>${gadget.name}</strong> (${gadget.price_guess || 'N/A'}) - ${gadget.reason || ''}
                  ${gadget.url ? `<br><a class="link-btn" href="https://${gadget.url}" target="_blank">Search on ${gadget.platform || 'Web'} &rarr;</a>` : ''}
                </li>
              `).join('')}
            </ul>
          ` : ''}
        `;
        goalsContainer.appendChild(card);
      });
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('output-container').classList.add('hidden');
      document.getElementById('planner-form').classList.remove('hidden');
    }
  </script>
</body>
</html>
